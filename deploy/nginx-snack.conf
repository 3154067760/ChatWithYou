# 把这段加到 /etc/nginx/sites-available/leylish.work 的 server { ... } 里
# 位置放在现有的 location / { ... } 之前（nginx 会优先匹配更长的前缀）
#
# 效果：
#   顾客     https://leylish.work/snack/
#   商家后台 https://leylish.work/snack/admin.html

# 没有结尾斜杠时补一个，保证相对路径（config.js、styles.css）解析正确
location = /snack {
    return 301 /snack/;
}

location /snack/ {
    # 注意：proxy_pass 末尾的 / 会把 /snack/ 前缀去掉再转给 Node
    proxy_pass http://127.0.0.1:3020/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # 商品图片上传走 JSON base64，留足体积
    client_max_body_size 20m;
}

