<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f5f5">
<title>商家登录 · 宿舍补给站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

<header class="login-top">
  <a class="lp-brand" href="index.html">
    <span class="logo">🍜</span>宿舍补给站
  </a>
  <a class="lp-back" href="index.html">← 返回点单页</a>
</header>

<main class="login-wrap">
  <form class="login-card" id="loginForm" novalidate>
    <span class="logo-big">🍜</span>
    <h1>商家登录</h1>
    <p class="login-sub">宿舍补给站 · 店主专用</p>

    <label class="lg-field">
      <span>用户名</span>
      <input id="username" type="text" autocomplete="username" autocapitalize="off"
             spellcheck="false" placeholder="请输入用户名">
    </label>

    <label class="lg-field">
      <span>密码</span>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    </label>

    <p class="lg-error" id="loginError" hidden></p>

    <button class="lg-btn" id="loginBtn" type="submit">登录</button>

    <p class="lg-tip">顾客点单不用登录，<a href="index.html">直接去点单 →</a></p>
  </form>
</main>

<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
