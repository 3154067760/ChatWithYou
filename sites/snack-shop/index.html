<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>宿舍补给站 · 扫码点单</title>
<meta name="description" content="宿舍零食、泡面、水果、饮料，扫码点单，送到宿舍门口。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="head-row">
      <div>
        <h1>宿舍补给站</h1>
        <p class="head-sub">零食 · 泡面 · 水果 · 饮料</p>
      </div>
      <p class="head-right">
        <span class="on">营业中</span><br><span id="hours">09:00–23:00</span>
      </p>
    </div>
    <nav class="tabs" id="tabs" aria-label="商品分类"></nav>
  </header>

  <main class="list" id="list"></main>

  <div class="page-foot">
    <p>满 <b id="fpMin">8</b> 元起送，满 <b id="fpFree">15</b> 元免配送费</p>
    <p>下单后加微信 <b id="fpWechat">sushe_buji</b> 付款</p>
    <p>电话 <b id="fpPhone">138-0000-0000</b></p>
    <p class="net-note" id="netNote"></p>
    <p class="my-orders"><a href="order.html">我的订单 / 查看进度</a></p>
    <p class="merchant-link"><a href="login.html">商家登录</a></p>
  </div>

</div>

<div class="cartbar" id="cartbar">
  <button class="cart-btn" id="cartOpen" type="button" aria-label="查看已选商品">
    🛒<span class="badge" id="cartCount" hidden>0</span>
  </button>
  <div class="cart-sum">
    <strong id="sumPrice">¥0.00</strong>
    <span id="sumHint">还没选东西</span>
  </div>
  <button class="cta" id="goCheckout" type="button" disabled>去结算</button>
</div>

<div class="mask" id="mask" hidden></div>

<section class="sheet" id="sheet" aria-hidden="true">
  <div class="grabber" aria-hidden="true"></div>
  <header class="sheet-head">
    <button class="icon-btn back" id="sheetBack" type="button" hidden aria-label="返回">←</button>
    <h2 id="sheetTitle">已选商品</h2>
    <button class="icon-btn" id="sheetClose" type="button" aria-label="关闭">✕</button>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
  <footer class="sheet-foot" id="sheetFoot"></footer>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:20px;text-align:center">需要开启 JavaScript 才能点单。</p></noscript>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
